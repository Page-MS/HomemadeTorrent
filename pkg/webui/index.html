<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torrent Node: {{.SiteID}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/main.js"></script>
    <script>
        window.siteInfo = {
            siteId: {{.SiteID}}
        };
    </script>
</head>

<body class="bg-stone-200 text-stone-800 font-mono p-5 m-0">
    <div class="max-w-4xl mx-auto bg-stone-50 border border-stone-400 p-5 shadow-sm">
        <h1 class="text-2xl border-b-2 border-stone-800 pb-2 mb-0">Node: {{.SiteID}} <span
                class="font-normal text-sm text-stone-500">(Port: {{.Port}})</span></h1>

        <div class="flex flex-wrap gap-5 mt-5">
            <div class="flex-1 min-w-[300px] border border-stone-300 p-4 bg-stone-100">
                <h2 class="text-lg mt-0 border-b border-dashed border-stone-300 pb-1 mb-3">Register Information</h2>
                <div id="register-info">
                    <p class="italic text-stone-600">Loading register info...</p>
                </div>
                <button onclick="fetchInfo()"
                    class="mt-3 bg-stone-200 border border-stone-500 py-1 px-2 text-stone-800 hover:bg-stone-300 transition-colors">
                    [ Refresh ]
                </button>
            </div>

            <div class="flex-1 min-w-[300px] border border-stone-300 p-4 bg-stone-100">
                <h2 class="text-lg mt-0 border-b border-dashed border-stone-300 pb-1 mb-3">Send Message (Local Input)
                </h2>

                <form id="command-form" class="flex flex-col gap-2">
                    <label for="message" class="text-sm">Raw Message:</label>
                    <textarea id="message" rows="6" class="w-full box-border border-2 border-stone-400 p-2 font-mono"
                        placeholder='ACTION:...'></textarea>

                    <button type="submit"
                        class="self-start bg-stone-200 border border-stone-500 py-1 px-2 text-stone-800 hover:bg-stone-300 transition-colors">
                        [ Send ]
                    </button>
                </form>

                <div id="status" class="hidden mt-3 p-2 border font-bold text-sm"></div>

                <h2 class="text-lg mt-2 border-b border-dashed border-stone-300 pb-1 mb-3">
                    Send Hooks
                </h2>
                <button
                    type="submit"
                    data-message="ACTION:LOCAL_SC_REQUEST
DEST:{{.SiteID}}

"
                    class="sendbutton self-start bg-stone-200 border border-stone-500 py-1 px-2 text-stone-800 hover:bg-stone-300 transition-colors">
                    [ START SC ]
                </button>
                <button
                    type="submit"
                    data-message="ACTION:MARKER
ID:snap_start
DEST:{{.SiteID}}
SENDER:USER

"
                    class="sendbutton self-start bg-stone-200 border border-stone-500 py-1 px-2 text-stone-800 hover:bg-stone-300 transition-colors">
                    [ START SNAPSHOT ]
                </button>
            </div>
        </div>
    </div>

    <script>
        function updateStatus(msg, isError = false) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = msg;

            if (isError) {
                statusEl.className = 'block mt-3 p-2 border border-red-600 bg-red-50 text-red-700 font-bold text-sm';
            } else {
                statusEl.className = 'block mt-3 p-2 border border-green-600 bg-green-50 text-green-700 font-bold text-sm';
            }

            setTimeout(() => {
                statusEl.className = 'hidden';
            }, 3000);
        }

        async function fetchInfo() {
            const container = document.getElementById('register-info');
            try {
                const response = await fetch('/api/info');
                const data = await response.json();
                console.log(data);

                if (!data.Files || data.Files.length === 0) {
                    container.innerHTML = '<p class="italic text-stone-600">No files in register.</p>';
                    return;
                }

                let html = '<ul class="m-0 p-0 list-none space-y-2">';
                data.Files.forEach(file => {
                    const { id, name, file_parts, peers_with_file, size } = file;
                    const hasFile = peers_with_file && peers_with_file.includes(data.SiteID);
                    const statusClass = hasFile ? 'text-green-700 font-bold' : 'text-stone-500';
                    const statusText = hasFile ? '[Available Locally]' : '[Available on network]';

                    html += `
                        <li class="border border-stone-200 bg-white p-3">
                            <div class="flex justify-between items-start">
                                <span class="font-bold">${name}</span>
                                <span class="text-sm ${statusClass}">${statusText}</span>
                            </div>
                            <div class="text-sm text-elispis text-stone-600 mt-2 pt-2 border-t border-dotted border-stone-200">
                                ID: ${id.slice(0, 10) || "N/A"}<br>
                                Parts: ${file_parts.length}
                                ${peers_with_file ? '<br>Peers: ' + peers_with_file.join(', ') : ''}
                            </div>
                        </li>
                    `;
                });
                html += '</ul>';
                container.innerHTML = html;
            } catch (err) {
                console.error('Failed to fetch info:', err);
                container.innerHTML = '<p class="italic text-red-600">Failed to load.</p>';
            }
        }

        const msgInput = document.getElementById('message');
        async function sendMessage(msg) {
            msg = msg.trim();
            if (!msg) return;

            try {
                const formData = new URLSearchParams();
                formData.append('message', msg);

                const response = await fetch('/api/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });

                if (response.ok) {
                    updateStatus('Message sent successfully!');
                    msgInput.value = '';
                } else {
                    updateStatus('Failed to send message: ' + response.statusText, true);
                }
            } catch (err) {
                updateStatus('Network error while sending', true);
            }
        }

        document.querySelectorAll('.sendbutton').forEach(el => {
            el.addEventListener('click', async (e) => {
                msg = e.target.dataset.message;
                sendMessage(msg);
            });
        });

        document.getElementById('command-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = msgInput.value.trim();
            sendMessage(msg);
        });

        fetchInfo();
    </script>
</body>

</html>
